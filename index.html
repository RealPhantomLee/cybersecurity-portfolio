<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RealPhantomLee Tucker — Cybersecurity Architecture Portfolio</title>
  <meta name="description" content="Cybersecurity, cloud, hardware, and AI/ML projects by RealPhantomLee Tucker — documentation-first, evidence-driven builds.">
  <link rel="stylesheet" href="data/styles.css">
</head>

<body>

  <div id="architecture-container"></div>

  <div id="ui-layer">
    <header id="site-header">
      <h1>RealPhantomLee Tucker</h1>
      <p>Cybersecurity Architecture Portfolio · <a href="https://github.com/RealPhantomLee" target="_blank" rel="noreferrer">github.com/RealPhantomLee</a></p>
    </header>

    <div id="projects-grid"></div>
  </div>

  <script>
    async function loadCards() {
      const res = await fetch("data/portfolio.json?v=" + Date.now());
      const projects = await res.json();

      const grid = document.getElementById("projects-grid");
      grid.innerHTML = "";

      projects.forEach(p => {
        const card = document.createElement("a");

        card.className = "project-card";
        card.dataset.slug = p.slug;
        card.href = `projects/${p.slug}.html`;

        card.innerHTML = `
          <div class="project-category">${p.category}</div>
          <div class="project-title">${p.title}</div>
          <div class="project-desc">${p.description}</div>
        `;

        grid.appendChild(card);
      });

      window.dispatchEvent(new Event("cards-loaded"));
    }

    loadCards();
  </script>

  <script type="module" src="scripts/architecture.js"></script>

</body>
</html>
